name: Machine Learning

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Update README timestamp
        shell: bash
        run: |
          set -euo pipefail

          TIMESTAMP=$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')

          # Hapus seluruh isi README dan tulis satu baris timestamp.
          printf '%s\n' "$TIMESTAMP" > README.md

          echo "README.md diperbarui: $TIMESTAMP"

      - name: Wait 5 seconds
        run: sleep 5

      - name: Commit and push
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail

          git config user.name "ItsukaShidouu"
          git config user.email "itsukashidoouu@gmail.com"

          if git diff --quiet -- README.md; then
            echo "README.md tidak berubah."
            exit 0
          fi

          git add README.md
          git commit -m "re: update"

          git -c \
            http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_PAT" | base64 -w 0)" \
            push origin HEAD:main
