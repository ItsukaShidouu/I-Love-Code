name: Machine Learning

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    # Mencegah loop dari commit bot sendiri.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Update README timestamp
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f README.md ]; then
            echo "README.md tidak ditemukan."
            exit 1
          fi

          TIMESTAMP=$(TZ=Asia/Jakarta date '+%Y-%m-%d %H:%M:%S WIB')
          MARKER="<!-- AUTO-UPDATE-TIMESTAMP -->"
          END_MARKER="<!-- END-AUTO-UPDATE-TIMESTAMP -->"

          if ! grep -Fq "$MARKER" README.md; then
            printf '\n## Aktivitas Terakhir\n\n%s\n%s\n' \
              "$MARKER" "$END_MARKER" >> README.md
          fi

          python3 - "$TIMESTAMP" "$MARKER" "$END_MARKER" <<'PY'
          import sys
          from pathlib import Path

          timestamp, marker, end_marker = sys.argv[1:]
          path = Path("README.md")
          content = path.read_text(encoding="utf-8")

          start = content.find(marker)
          if start == -1:
              raise SystemExit("Marker awal tidak ditemukan")

          end = content.find(end_marker, start + len(marker))
          if end == -1:
              raise SystemExit("Marker akhir tidak ditemukan")

          replacement = (
              f"{marker}\n\n"
              f"Terakhir diperbarui: {timestamp}\n"
              f"{end_marker}"
          )

          updated = content[:start] + replacement + content[end + len(end_marker):]
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit and push README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- README.md; then
            echo "README.md tidak berubah."
            exit 0
          fi

          git add README.md
          git commit -m "chore: update README Jakarta timestamp"
          git push
